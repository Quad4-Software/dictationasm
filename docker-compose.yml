# Local / generic Compose stack for dictationasm.
# Build uses the pinned multi-stage Dockerfile (Alpine 3.24 + Go digests).

name: dictationasm

services:
  dictationasm:
    image: ${IMAGE:-ghcr.io/quad4-software/dictationasm:${VERSION:-0.1.0}}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: "${VERSION:-0.1.0}"
        REVISION: "${REVISION:-local}"
        CREATED: "${CREATED:-unknown}"
    container_name: dictationasm
    restart: unless-stopped
    init: true
    ports:
      - "${HOST_PORT:-127.0.0.1:8080}:8080"
    environment:
      DICTATIONASM_ADDR: ${DICTATIONASM_ADDR:-:8080}
      DICTATIONASM_WEB: ${DICTATIONASM_WEB:-/app/web}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,uid=65532,gid=65532
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    ulimits:
      nproc: 256
      nofile:
        soft: 1024
        hard: 2048
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1.0
    cpu_shares: 512
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - dictationasm

networks:
  dictationasm:
    driver: bridge
    internal: false
