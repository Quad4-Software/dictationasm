<body>
  <div class="chrome-top">
    <a class="chrome-link" href="https://github.com/Quad4-Software/dictationasm" rel="noopener noreferrer" target="_blank">Source</a>
  </div>
  <div class="atmosphere" aria-hidden="true"></div>
  <div id="drop-overlay" class="drop-overlay" hidden aria-hidden="true">
    <p>Drop audio or video to dictate</p>
  </div>
  <main class="stage">
    <header class="brand-block">
      <p class="brand">dictationasm</p>
      <h1 class="headline">Speak. Watch it land.</h1>
      <p class="lede">Live offline dictation with Moonshine and Silero VAD. Partials appear as you talk. Nothing is uploaded.</p>
    </header>

    <div class="workspace">
      <section class="panel panel-input" aria-label="Capture">
        <div class="hero-visual" aria-hidden="true">
          <canvas id="wave" width="1200" height="280"></canvas>
        </div>

        <div class="controls">
          <div class="control-row">
            <label class="field">
              <span>Voice style</span>
              <select id="model"></select>
            </label>
          </div>
          <div class="control-row toggles-row">
            <label class="toggle" for="timestamps">
              <input type="checkbox" id="timestamps" checked>
              <span class="toggle-ui" aria-hidden="true"></span>
              <span class="toggle-label">Show times</span>
            </label>
          </div>
        </div>

        <div class="action-dock" id="action-dock">
          <div class="cta-row">
            <button type="button" id="btn-mic" class="cta record" aria-pressed="false">
              <svg class="rec-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
                <path fill="currentColor" d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3m7 9c0 3.53-2.61 6.44-6 6.93V21h-2v-3.07c-3.39-.49-6-3.4-6-6.93h2a5 5 0 0 0 10 0z"/>
              </svg>
              <span class="rec-label">Record</span>
              <span class="rec-timer" id="rec-timer" hidden>0:00</span>
            </button>
            <label class="cta secondary file-cta">
              <svg class="file-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
                <path fill="currentColor" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zm0 2 4 4h-4zM8 13h8v2H8zm0 4h8v2H8zm0-8h5v2H8z"/>
              </svg>
              <span>Upload</span>
              <input type="file" id="file" accept="audio/*,video/*,.wav,.wave,.mp3,.ogg,.oga,.opus,.flac,.m4a,.aac,.webm,.mp4,.m4v,.mkv,.mov,.avi,.mpeg,.mpg,.3gp" hidden>
            </label>
          </div>
        </div>

        <div class="capture-status">
          <div class="status-row">
            <span id="live-pill" class="live-pill" aria-hidden="true">Live</span>
            <span id="spinner" class="spinner" hidden aria-hidden="true"></span>
            <p id="status" class="status" role="status">Getting ready...</p>
          </div>
          <div class="progress-track" hidden>
            <div id="progress" class="progress-bar"></div>
          </div>
          <p id="error" class="error" role="alert" hidden></p>
        </div>
      </section>

      <section class="panel panel-result" aria-label="Transcript">
        <div class="result-toolbar">
          <h2>Transcript</h2>
          <div class="result-actions">
            <button type="button" id="btn-copy" class="action-btn" disabled>Copy</button>
            <div class="export-wrap">
              <button type="button" id="btn-export" class="action-btn" disabled aria-haspopup="menu" aria-expanded="false">Export</button>
              <div id="export-menu" class="export-menu" role="menu" hidden>
                <button type="button" role="menuitem" data-format="txt">TXT</button>
                <button type="button" role="menuitem" data-format="srt">SRT</button>
                <button type="button" role="menuitem" data-format="vtt">VTT</button>
                <button type="button" role="menuitem" data-format="json">JSON</button>
              </div>
            </div>
            <button type="button" id="btn-clear" class="action-btn action-btn-muted" disabled>Clear</button>
          </div>
        </div>
        <div id="transcript" class="transcript" tabindex="0" aria-live="polite"></div>
        <p id="meta" class="meta" hidden></p>
      </section>
    </div>
  </main>
