# Pinned actions (bump tag and SHA together when upgrading):
#   actions/checkout@v7.0.1                 3d3c42e5aac5ba805825da76410c181273ba90b1
#   treosh/lighthouse-ci-action@12.6.2      3e7e23fb74242897f95c0ba9cabad3d0227b9b18
#
# Secure use: least-privilege GITHUB_TOKEN, pin actions to full commit SHAs,
# pull_request (not pull_request_target), no untrusted checkout with secrets.
# https://docs.github.com/en/actions/reference/security/secure-use

name: Lighthouse

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: lighthouse-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit web/ and assert gates
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
