# Pinned actions (bump tag and SHA together when upgrading):
#   actions/checkout@v7.0.1                      3d3c42e5aac5ba805825da76410c181273ba90b1
#   github/codeql-action/init@v4.37.9             cdf488f595d80d6e07e03d4674febd5ab45fa938
#   github/codeql-action/autobuild@v4.37.9        cdf488f595d80d6e07e03d4674febd5ab45fa938
#   github/codeql-action/analyze@v4.37.9          cdf488f595d80d6e07e03d4674febd5ab45fa938
#   step-security/harden-runner@v2.21.1           e14015d583714f6e62063499dc959a02595150a1
#
# Secure use: least-privilege GITHUB_TOKEN, SHA-pinned actions, no pull_request_target.
# https://docs.github.com/en/actions/reference/security/secure-use

name: CodeQL

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "28 7 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}

      - name: Autobuild
        if: matrix.language == 'go'
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
